name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  commit-policy:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: commit-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch default branch
        run: git fetch origin "${{ github.event.repository.default_branch }}" --depth=1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine commit range
        id: range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)"
              range="${base}..${{ github.sha }}"
            else
              range="${before}..${{ github.sha }}"
            fi
          fi

          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Validate commit messages
        run: python scripts/validate_commit_messages.py --rev-range "${{ steps.range.outputs.range }}"

  validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: commit-policy

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r LuftDocs_API/requirements.txt

      - name: Validate version metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          namespace = {}
          exec(Path('_version.py').read_text(encoding='utf-8'), namespace)
          version = namespace['__version__']

          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Versao invalida em _version.py: {version}')

          metadata = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          if metadata['project']['name'] != 'luftdocs-monorepo':
              raise SystemExit('pyproject.toml nao contem o nome esperado do monorepo.')

          print(f'Versao validada: {version}')
          PY

      - name: Validate Python syntax
        run: |
          python -m compileall _version.py scripts Luft-Docs LuftDocs_API

      - name: Validate entry points
        run: |
          python -m py_compile Luft-Docs/App.py Luft-Docs/Wsgi.py LuftDocs_API/Wsgi.py LuftDocs_API/App/Main.py

  bundle:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: bundle
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source bundle
        shell: bash
        run: |
          mkdir -p dist
          short_sha="${GITHUB_SHA::7}"
          git archive --format=zip --output "dist/luftdocs-monorepo-${short_sha}.zip" HEAD

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: luftdocs-monorepo-bundle
          path: dist/*.zip