[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luftdocs-monorepo"
dynamic = ["version"]
description = "Monorepo do portal LuftDocs e da API LuftDocs." 
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Widson64x" }
]
keywords = ["flask", "fastapi", "docs", "monorepo", "vault"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[project.urls]
Homepage = "https://github.com/Widson64x/Luft-Docs"
Repository = "https://github.com/Widson64x/Luft-Docs"

[tool.setuptools]
py-modules = ["_version"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100